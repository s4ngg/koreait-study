<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS DOM Practice</title>
</head>

<body>
    <fieldset>
        <legend>문제1</legend>
        <h4>div 태그의 배경색을 빨간색으로 변경하세요.</h4>
        <div id="my-div">이 div의 배경색을 변경하세요.</div>
        <button onclick="changeBackgroundColor()">배경색 변경</button>
        <script>
            let q1Div = document.getElementById("my-div");

            function changeBackgroundColor(){
                q1Div.style.backgroundColor = "red";
            }
        </script>
    </fieldset>

    <fieldset>
        <legend>문제2</legend>
        <h4>이미지를 클릭하면 이미지의 크기가 2배로 확대되도록 작성하세요.</h4>
        <img id="my-image" src="https://picsum.photos/200/150" width="200" height="150" onclick="zoomImage()">
        <script>
            let q2Img = document.getElementById("my-image");

            function zoomImage(){
                q2Img.style.width = (q2Img.width*2) + "px";
                q2Img.style.height = (q2Img.height*2) + "px";

            }
        </script>
    </fieldset>

    <fieldset>
        <legend>문제3</legend>
        <h4>input에 입력한 값을 todo 리스트에 추가하세요.</h4>
        <input type="text" id="todo-input" placeholder="할 일을 입력하세요">
        <button onclick="addTodo()">추가</button>
        <ul id="todo-list">

        </ul>
        <script>
            function addTodo(){
                let q3Todo = document.getElementById("todo-input").value;
                let todoList = document.getElementById("todo-list");
                let li = document.createElement("li");

                li.textContent = q3Todo;
                todoList.appendChild(li);
            }
        </script>
    </fieldset>

    <fieldset>
        <legend>문제4</legend>
        <h4>버튼을 클릭하면 p태그의 배경색을 변경하세요.</h4>
        <p id="color-text">이 문단의 배경색을 변경하세요.</p>
        <button onclick="redc()">빨간색 배경</button>
        <button onclick="yellowc()">노란색 배경</button>
        <button onclick="bluec()">아쿠아색 배경</button>

        <script>
            let q4P = document.getElementById("color-text");
            function redc(){
                q4P.style.backgroundColor = "red";
            }

            function yellowc(){
                q4P.style.backgroundColor = "yellow";
            }

            function bluec(){
                q4P.style.backgroundColor = "blue";
            }
        </script>
    </fieldset>

    <fieldset>
        <legend>문제5</legend>
        <h4>입력값에 따라 링크를 생성하세요.</h4>
        <p style="margin:0px">네이버 https://www.naver.com</p>
        <p style="margin:0px">다음 https://www.daum.net</p>
        <p style="margin:0px; margin-bottom: 20px;">구글 https://www.google.com</p>
        <input type="text" id="link-input" placeholder="네이버 / 다음 / 구글">
        <button onclick="addLink()">링크 추가</button>
        <ul id="link-list">
            <!-- <li>
                <a href="https://www.naver.com">네이버</a>
            </li> -->
        </ul>
        <script>
            function addLink(){
                let q5Input = document.getElementById("link-input").value;
                let q5Link = document.getElementById("link-list");
                let li = document.createElement("li");
                let a = document.createElement("a");

                if(q5Input === "네이버"){
                    a.href = "https://www.naver.com";
                    a.textContent = "네이버";
                } else if(q5Input ==="다음"){
                    a.href = "https://www.daum.net";
                    a.textContent = "다음";
                } else if(q5Input === "구글"){
                    a.href = "https://www.google.com";
                    a.textContent = "구글";
                }
                else{
                    alert("보기에 없는 링크입니다.");
                    return ;
                }
                li.appendChild(a);
                q5Link.appendChild(li);
            }
        </script>
    </fieldset>
    
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>
</html>
