<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1. 일반 함수
        // - 가장 일반적으로 사용되는 함수
        // - 호이스팅 가능
        func1("hi");
        function func1(str){
            console.log(str);
        }

        // 2. 익명 함수
        // - 이름이 없는 함수
        const func2 = function(str){
            console.log(str);
        }

        // 3. 화살표 함수
        // - 코드의 라인을 줄이기 위해 사용
        // - this 바인딩 방식과 객체 생성, 구조 등이 일반 함수와 다름
        const func3 = (num1, num2) => num1 + num2;

        // - 매개변수 1개일 때 : 소괄호 생략 가능
        const square = num1 => num1 * num1;

        // - 매개변수 없을때 : 비어있는 소괄호만 작성
        const printHello = () => "Hello";
        console.log(printHello);
        console.log(printHello());
        console.log(typeof printHello);

        // - 여러 줄 작성할 때 : 중괄호 사용
        const add = (num1, num2) => {
            let result = num1 + num2;
            return result;
        }

        // 4. 생성자 함수
        // - 객체를 생성하여 재사용하기 위해 사용
        // - 관례적으로 생성자 함수는 앞 글자를 대문자로 표시
        function Person(name, age){
            this.name = name;
            this.age = age;
            this.walk = function(){
                console.log("걷는 중");
            }
        }

        const p1 = new Person("김재섭", 19);
        const p2 = new Person("홍길동", 21);

        console.log(p1);
        console.log(p2);

        console.log(p1.name);
        p1.walk();

        // 5. 내부함수와 재귀함수
        // - 내부 함수 : 함수 안에 또 다시 정의된 함수
        // - 재귀 함수 : 자기 자신을 호출하는 함수

        // 내부 함수
        function outer(){
            let x = 10;
            
            function inner(){
                console.log(x);
            }

            inner();
        }

        outer();

        // 재귀 함수
        function countdown(cnt){
            if (cnt === 0){
                console.log("0이 되었습니다.");
            } else {
                console.log(cnt);
                countdown(cnt - 1);
            }
        }

        // 6. 콜백 함수
        // - 매개변수에 함수가 들어오는 방식
        function first(callback){
            console.log("First");

            if(typeof callback === "function"){
                callback();
            }
        }

        // 함수를 호출할 때 인자로 함수를 전달
        first(function() {
            console.log("Second");
        })

        function processUser(name, callback){
            console.log("--- 요청 시작 ---");
            // console.log(name + "님 어서오세요.");
            callback(name);
            console.log("--- 요청 종료 ---");
        }

        // 1) 개발자 A는 "000님 환영합니다." 출력
        processUser("김재섭", function(name){
            console.log(name + "님 환영합니다.");
        })

        // 2) 개발자 B는 "000님이 로그인하셨습니다." 출력
        // - 함수 미리 만들고 전달하기
        function developerB (name){
            console.log(name + "님이 로그인하셨습니다.");
        }

        processUser("홍길동", developerB);

        // 3) 개발자 C는 "접속 완료!" 출력
        processUser("철수", (name) => {
            console.log("접속 완료!");
        })

        function calc(a,b,operation){
            return operation(a, b);
        }

        // 1) 더하는 기능을 가진 함수
        // - ex) 3 + 4
        calc(3, 4, function(a, b){
            console.log(a+b);
        })
        // 2) 곱하는 기능을 가진 함수
        // - ex) 10 * 6
        calc(10, 6, function(a, b){
            console.log(a * b);
        })
        
        
    </script>    
</body>
</html>
