<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
                width: 220px;
                height: 140px;
                border: 1px solid rgb(212, 212, 212);
                background-color: rgb(212, 212, 212);
                position: relative;
                padding: 10px;
            }
        .badge{
            padding: 6px 10px;
            color: white;
            font-weight: bold;
            background-color: rgb(235, 90, 90);
            position: absolute;
            left: 75%;
            top: 3%;
        }
    </style>
</head>
<body>
    <div class="card">
        상품 카드
        <div class="badge">NEW</div>
    </div>
</body>
</html>
