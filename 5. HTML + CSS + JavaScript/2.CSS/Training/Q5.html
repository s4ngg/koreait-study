<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent {
            width: 300px;
            height: 150px;
            background-color: lightgray;
            position: relative;   /* 자식의 기준점 */
        }

        .box1 {
            width: 100px;
            height: 120px;
            background-color: skyblue;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .box2 {
            width: 110px;
            height: 120px;
            background-color: tomato;
            position: absolute;
            top: 30px;
            left: 80px;
            z-index: 2;   /* box1 위에 표시 */
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box1"></div>
        <div class="box2"></div>
    </div>
</body>
</html>
